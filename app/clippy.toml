# Sikkerhet (arkitektur.md kap. 8): appen starter ingen programmer og skriver
# aldri til skjermkortet. NVML lastes med dlopen i rigg-hw/src/gpu/nvml.rs, og
# bare lesefunksjoner kan slås opp (nvmlDeviceGet*, nvmlSystemGet*, se
# NvmlLib::sym). Testen rigg-hw/tests/bare_lesing.rs søker gjennom kildekoden.
# Det ene unntaket for Command::new er reserven når systemd --user mangler
# (rigg/src/client.rs), og det er merket med #[allow] og en forklaring. Fra
# 1.2.0 (7A) starter bryteren i Innstillinger › Styring pkexec med
# gio::Subprocess, også merket med #[allow].
disallowed-methods = [
    { path = "std::process::Command::new", reason = "Appen starter ingen programmer (arkitektur.md kap. 8)" },
    { path = "libc::ioctl", reason = "Ingen ioctl: bare lesing fra /proc og /sys" },
    { path = "gio::Subprocess::newv", reason = "Appen starter ingen programmer; unntaket er pkexec fra bryteren i Innstillinger › Styring (7A)" },
]
