[package]
name = "rigg-helper"
description = "Agentic Rigg: root-hjelperen som endrer skjermkortet, med trinn som godkjennes hver for seg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentic-rigg-helper"
path = "src/main.rs"

# Så få avhengigheter som mulig: ingen GLib-løkke, ingen D-Bus, ingen tråder.
# rigg-hw gir bare skrivedelen (gpu::skriv); NVML-delen er sperret.
[dependencies]
rigg-core.workspace = true
rigg-hw.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
serde_json.workspace = true
libc.workspace = true
