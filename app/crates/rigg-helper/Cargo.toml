[package]
name = "rigg-helper"
description = "Agentic Rigg: kortbundet administratorhjelper for GPU-effekt, vifter og klokker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentic-rigg-helper"
path = "src/main.rs"

# Så få avhengigheter som mulig: ingen GLib-løkke, ingen D-Bus, ingen tråder.
# Ekte NVML-skriving åpnes bare med autorisert, kortbundet helper-oppsett.
[dependencies]
rigg-core.workspace = true
rigg-hw = { workspace = true, features = ["ekte-skriving", "palit-rgb"] }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
serde_json.workspace = true
libc.workspace = true
