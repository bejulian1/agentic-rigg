  <rect x="4.5" y="4.5" width="39" height="35" rx="7" fill="none" stroke="{{glans-farge}}" stroke-opacity="{{glans}}"/>
  <path d="M14.81 31.19A13 13 0 1 1 33.19 31.19" fill="none" stroke="{{spor}}" stroke-opacity="{{spor-dekning}}" stroke-width="4" stroke-linecap="round"/>
