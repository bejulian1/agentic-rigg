<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>Agentic HW Monitor</title>
  <!-- 48 px (dokken i Ubuntu), tegnet på pikselrutenettet ({{navn}}). Laget av varianter/maler/48.svg. -->
