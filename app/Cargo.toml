# Agentic Rigg 1.2 · arbeidsområdet (docs/produksjon/arkitektur.md kap. 9).
# Versjonen står også i version.json; en test i rigg-core sjekker at de er like.
[workspace]
members = ["crates/rigg-core", "crates/rigg-hw", "crates/riggd", "crates/rigg", "crates/rigg-helper"]
resolver = "3"

[workspace.package]
version = "1.5.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
rigg-core = { path = "crates/rigg-core" }
rigg-hw = { path = "crates/rigg-hw" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
glib = "0.22"
gio = "0.22"
glib-unix = "0.22"
async-channel = "2.5"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
glib-build-tools = "0.22"

# Som Klipp, men uten panic = "abort": tjenesten fanger panikk i prøvetråden
# (arkitektur.md 4.6), og panic kan ikke settes per pakke.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
